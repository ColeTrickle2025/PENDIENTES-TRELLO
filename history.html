<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="js/pssync.js"></script>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#172b4d;margin:0;padding:8px;font-size:13px}
  .row{padding:7px 8px;border-bottom:1px solid #ebecf0}
  .d{color:#5e6c84;font-size:11px;font-weight:600} .c{margin-top:2px}
  .none{color:#5e6c84;padding:8px}
  b{color:#172b4d}
</style></head><body>
<div id="out" class="none">Cargando…</div>
<script>
var t=TrelloPowerUp.iframe();
t.card('desc').then(function(card){
  var m=PS.parseMarker(card.desc), out=document.getElementById('out');
  if(!m){ out.textContent='Esta tarjeta no proviene de Power Supply.'; return; }
  var log=(m.log||[]).slice().reverse();
  if(!log.length){ out.textContent='Sin cambios registrados todavía.'; out.className='none'; t.sizeTo('body'); return; }
  out.className=''; out.innerHTML=log.map(function(e){
    return '<div class="row"><div class="d">'+e.d+'</div><div class="c">'+
      e.c.map(function(x){return '<b>'+x.campo+':</b> '+esc(x.de)+' → '+esc(x.a);}).join('<br>')+'</div></div>';
  }).join('');
  t.sizeTo('body');
});
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
</script></body></html>
