<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="js/config.js"></script>
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;color:#172b4d}
button{background:#0c66e4;color:#fff;border:none;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer}</style>
</head><body>
<p>Para crear/mover tarjetas, autoriza el Power-Up una sola vez.</p>
<button id="go">Autorizar con Trello</button>
<script>
var t=TrelloPowerUp.iframe({appKey:PS_CONFIG.APP_KEY,appName:PS_CONFIG.APP_NAME});
document.getElementById('go').onclick=function(){
  t.getRestApi().authorize({scope:'read,write',expiration:'never'}).then(function(){ t.closePopup(); });
};
</script>
</body></html>
